server {
    # listen       80;
    # listen  [::]:80;

    listen 443 ssl;
    # listen [::]:443 ssl;

    server_name local.test;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/priv_nginx-ss.key;

    location / {
        proxy_pass http://host.docker.internal:1929;  # Your Next.js dev server
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for HMR
        proxy_buffering off;
        
        # Increase timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Specifically handle the webpack HMR endpoint
    location /_next/webpack-hmr {
        proxy_pass http://host.docker.internal:1929/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:9291/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name local.test;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}
