services:

  # development container to server next.js (+ static assets)
  # in production nginx will be installed on host
  web:
    image: nginx:latest
    volumes:
     - ./nginx:/etc/nginx
    ports:
     - "80:80"
     - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"


# How to copy /etc/nginx directory to mount it in volumes on host:
# docker run -d --name temp_nginx nginx:latest
# docker cp temp_nginx:/etc/nginx ./nginx-config



  pg: #_
    image: postgres:latest
    # never auto-restart for development | or `unless-stopped`
    restart: no # change on production to `always`
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${DBPASS}
    volumes:
      - xin_db:/var/lib/postgresql

volumes:
  xin_db:  # Docker manages this in /var/lib/docker/volumes/
