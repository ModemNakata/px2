[package]
name = "glosy"
version = "2.0.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
env_logger = "0.11.10"
log = "0.4.29"
qrcode = "0.14.1"
sea-orm = { version = "1.1.20", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "debug-print"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
